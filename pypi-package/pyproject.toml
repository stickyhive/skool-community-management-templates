[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skool-community-templates"
version = "1.0.0"
description = "CLI tool to generate Skool community management templates — onboarding checklists, DM sequences, content calendars, member reactivation workflows, and churn prevention systems."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.7"
authors = [
    {name = "StickyHive", email = "hello@stickyhive.ai"}
]
keywords = [
    "skool",
    "community",
    "community-management",
    "templates",
    "onboarding",
    "dm-sequences",
    "content-calendar",
    "churn-prevention",
    "member-engagement",
    "skool-automation"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Communications"
]

[project.urls]
Homepage = "https://stickyhive.ai"
Repository = "https://github.com/stickyhive/skool-community-management-templates"
Documentation = "https://stickyhive.github.io/skool-community-management-templates/"

[project.scripts]
skool-community-templates = "skool_community_templates.cli:main"

[tool.setuptools.package-data]
skool_community_templates = ["templates/*.md"]
